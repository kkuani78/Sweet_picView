[package]
name = "sweet-picview"
version = "1.6.3"
description = "Sweet picView 이미지 뷰어"
edition = "2021"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
kamadak-exif = "0.6"
jpeg-decoder = { version = "0.3", default-features = false }
spv-dragout = { path = "dragout" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "tga", "exr", "gif", "bmp", "webp", "ico"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
