name: Windows 설치파일 빌드

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # 서명 키가 없으면 업데이트 파일 없이 설치파일만 만든다
      - name: 빌드 (서명 키 없음)
        if: env.HAS_SIGNING_KEY != 'true'
        run: npx tauri build --config src-tauri/tauri.nosign.conf.json

      # PR: 설치파일만 만들어 Artifacts로 올림
      - name: 빌드 (PR)
        if: env.HAS_SIGNING_KEY == 'true' && github.event_name != 'push'
        run: npx tauri build

      # main: 빌드 + GitHub 릴리스 (앱의 '업데이트' 버튼이 여기서 새 버전을 받음)
      - name: 바뀐 점 읽기 (CHANGES.md)
        id: notes
        if: env.HAS_SIGNING_KEY == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          body=$(awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGES.md | sed '/^[[:space:]]*$/d')
          { echo 'body<<NOTES_EOF'; echo "$body"; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"

      - name: 빌드 + 릴리스 (main)
        if: env.HAS_SIGNING_KEY == 'true' && github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Sweet picView v__VERSION__
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---
            처음 설치: 아래 Assets의 `..._x64-setup.exe`를 받아 실행하세요.
            이미 설치되어 있으면 앱 위쪽의 **⬆ 업데이트** 버튼(또는 아래 상태줄의 버전 표시 클릭)으로 업데이트할 수 있어요.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - uses: actions/upload-artifact@v4
        with:
          name: SweetPicView-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
